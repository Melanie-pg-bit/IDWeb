<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="card-container">
    <form class="card-form" action="#" method="POST">
      <h2>Registro de Estudiante</h2>

      <!-- Bloque 1: Información Personal -->
      <fieldset>
        <legend>Información Personal</legend>

        <div class="form-group">
          <label for="codigo">Código de Estudiante:</label>
          <input type="text" id="codigo" name="codigo" pattern="[0-9]{8}" placeholder="Ej. 12345678" required title="Debe contener exactamente 8 dígitos numéricos">
        </div>

        <div class="form-group">
          <label for="nombres">Nombres y Apellidos:</label>
          <input type="text" id="nombres" name="nombres" required>
        </div>

        <div class="form-group">
          <label for="fnacimiento">Fecha de Nacimiento:</label>
          <input type="date" id="fnacimiento" name="fnacimiento" min="1950-01-01" max="2008-12-31" required>
        </div>

        <div class="form-group">
          <label for="carrera">Carrera Profesional:</label>
          <select id="carrera" name="carrera" required>
            <option value="">-- Seleccione una carrera --</option>
            <option value="sistemas">Ingeniería de Sistemas</option>
            <option value="industrial">Ingeniería Industrial</option>
            <option value="software">Ingeniería de Software</option>
          </select>
        </div>

        <div class="form-group">
          <label>Turno:</label>
          <div class="options-inline">
            <label><input type="radio" name="turno" value="manana" required> Mañana</label>
            <label><input type="radio" name="turno" value="tarde"> Tarde</label>
            <label><input type="radio" name="turno" value="noche"> Noche</label>
          </div>
        </div>
      </fieldset>

      <!-- Bloque 2: Información de la Cuenta -->
      <fieldset>
        <legend>Información de la Cuenta</legend>

        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required title="Mínimo 8 caracteres, al menos una mayúscula y un número">
        </div>

        <div class="form-group">
          <label for="comentarios">Comentarios u Observaciones:</label>
          <textarea id="comentarios" name="comentarios" rows="3" placeholder="Escribe aquí..."></textarea>
        </div>

        <div class="form-group checkbox-group">
          <label for="terminos">
            <input type="checkbox" id="terminos" name="terminos" required> Acepto los términos y condiciones
          </label>
        </div>
      </fieldset>

      <button type="submit" class="btn-submit">Registrar Estudiante</button>
    </form>
  </main>

</body>
</html>
