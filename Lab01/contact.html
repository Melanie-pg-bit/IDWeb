    <!-- BLOQUE DERECHO: Formulario de Contacto -->
    <div class="tarjeta-derecha">
      
      <header>
        <h1>Contacto</h1>
        <p><strong>Estudiante:</strong> Melanie Paredes Gonzales</p>
      </header>

      <hr>

      <main>
        <article>
          <h2>Ponte en contacto conmigo</h2>
          <p>Completa el siguiente formulario para enviarme un mensaje o sugerencia.</p>
          
          <form action="#" method="post">
            <p>
              <label for="nombre"><strong>Nombre:</strong></label><br>
              <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </p>

            <p>
              <label for="email"><strong>Correo Electrónico:</strong></label><br>
              <input type="email" id="email" name="email" required placeholder="tu@correo.com">
            </p>

            <p>
              <label for="asunto"><strong>Asunto:</strong></label><br>
              <input type="text" id="asunto" name="asunto" required placeholder="Motivo de mensaje">
            </p>

            <p>
              <label for="mensaje"><strong>Mensaje:</strong></label><br>
              <textarea id="mensaje" name="mensaje" rows="5" cols="30" required placeholder="Escribe tu mensaje aquí..."></textarea>
            </p>

            <p>
              <button type="submit">Enviar Mensaje</button>
            </p>
          </form>
        </article>
      </main>

      <footer>
        <address>
          Contacto: mparedesgo@unsa.edu.pe
        </address>
        <p>&copy; 2026 Todos los derechos reservados.</p>
      </footer>
